on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    paths:
      - "og/**"
      - "src/blog/**"
      - "flake.nix"
      - "flake.lock"

concurrency:
  # PRでは同一PR内の古い実行をキャンセルする (head_refがグループ名になる)。
  # それ以外 (mainへのpush・workflow_dispatch) はrunごとにユニークなグループ
  # (run_id) になるため一切キャンセルされない。
  # mainのrunをキャンセルすると、og/やsrc/blog/ (OGフォントのコーパス) の
  # 変更を含むrunが中断されたとき、次のrunのpaths-filterは直前コミットとの
  # 差分しか見ないためOG Workerの再デプロイがスキップされ、記事タイトルの
  # グリフが欠けたOG画像が生成されてしまうため。
  # (注意: queue: maxとcancel-in-progress: trueはリテラル・式ともに併用不可
  # なので、デプロイの直列化はdeployジョブ側のqueue: maxで行う)
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      og: ${{ steps.filter.outputs.og }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            og:
              # Worker本体
              - "og/**"
              # フォントのサブセット元コーパス (記事のtitle/description)
              - "src/blog/**"
              # ogFonts derivationとWorkerのビルド定義
              - "flake.nix"
              - "flake.lock"

  test-og:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.og == 'true'
    runs-on: ubuntu-latest
    name: Test OG worker
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # ツールチェーン (gleam/nodejs) もフォントもflakeで単一管理する:
      # devShells.og-ci (gleam + nodejs + フォント配置shellHook) が
      # setup-beamと `nix build .#og-fonts` + cp の両ステップを置き換える。
      # og_workerはtarget = "javascript"のためOTP/rebar3は不要
      # (erlをPATHから外してもgleam testが全件passすることを検証済み)
      - name: Test OG worker
        run: |
          nix develop .#og-ci --command bash -c '
            set -e
            cd og
            gleam deps download
            npm ci
            gleam test
            gleam format --check src test
          '

  deploy:
    needs: [changes, test-og]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.changes.result == 'success'
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read
      id-token: write
    # デプロイのみ直列化する。queue: maxで最大100件待機し1件ずつ完走させる
    # (cancel-in-progressと併用不可なのでキャンセルではなく待機で競合を回避。
    # キャンセルするとOGフォントのコーパス変更を含むrunのデプロイが飛ぶため)
    concurrency:
      group: ${{ github.workflow }}-deploy-${{ github.ref }}
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          # RSS dates come from git commit times, so the full history
          # (not a shallow clone) is required for correct pubDates.
          fetch-depth: 0
      - uses: nixbuild/nix-quick-install-action@v35
      # - uses: cachix/install-nix-action@v31
      #   with:
      #     github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@main

      # - name: Restore and save Nix store
      #   uses: nix-community/cache-nix-action@v7
      #   with:
      #     primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
      #     restore-prefixes-first-match: nix-${{ runner.os }}-
      #     gc-max-store-size-linux: 1G
      #     purge: true
      #     purge-prefixes: nix-${{ runner.os }}-
      #     purge-created: 0
      #     purge-last-accessed: P1DT12H
      #     purge-primary-key: never

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-

      - name: Install dependencies
        run: |
          nix develop .#ci --command vp install --frozen-lockfile

      - name: Run URL/feed compatibility tests
        run: |
          nix develop .#ci --command bash -c '
            DISABLE_LINKCARD=1 vp build &&
            BUILD_OUTPUT_DIR=dist deno test --allow-all tests/url_compat_test.ts tests/feed_compat_test.ts
          '

      - name: Build & Deploy blog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          nix develop .#ci --command bun run build
          nix develop .#ci --command wrangler pages deploy ./dist --project-name=blog --commit-dirty=true

      # OG Workerはビルド入力 (og/・記事コーパス・nix定義) に変更がある場合のみ
      # デプロイ (手動実行時は常にデプロイ)
      # deploy-og は deno/gleam/npm/wrangler を使うため、それらを含む .#og-ci
      # を使う (editor tooling込みのデフォルトdevShellはCI向けでないため。
      # .#og-ci のshellHookがogFontsでサブセットしたフォントを
      # og/static/fonts/ に配置する)
      - name: Deploy OG worker
        if: >-
          (github.event_name == 'workflow_dispatch' || needs.changes.outputs.og == 'true') &&
          needs.test-og.result == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: nix develop .#og-ci --command deno task deploy-og
