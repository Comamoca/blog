on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  # OG Workerのビルド入力 (og/・フォントのコーパス元・nix定義) に変更を含むPRでは、
  # デプロイせずテストのみ実行する
  pull_request:
    paths:
      - "og/**"
      - "src/blog/**"
      - "flake.nix"
      - "flake.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # OG Worker (og/) のビルド入力に変更があったかを検出する
  # (test-og / OG Workerデプロイの条件に使う)
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      og: ${{ steps.filter.outputs.og }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            og:
              # Worker本体
              - "og/**"
              # フォントのサブセット元コーパス (記事のtitle/description)
              - "src/blog/**"
              # ogFonts derivationとWorkerのビルド定義
              - "flake.nix"
              - "flake.lock"

  # OG Worker (og/) のテスト。OG Workerのビルド入力に変更があるPR/pushでのみ
  # 実行される (旧 og/.github/workflows/test.yml を統合。サブディレクトリの
  # workflowはGitHub Actionsが読まないためルートに移した)
  test-og:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.og == 'true'
    runs-on: ubuntu-latest
    name: Test OG worker
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # og_worker/router.gleam のASSETS bindingとgleam testの
      # test_support.load_file_bytes が参照する og/static/fonts/*.ttf は
      # gitにコミットせず、flake.nixの packages.og-fonts (pyftsubsetで
      # ブログ記事コーパスからサブセット生成) をここでビルドして配置する
      - name: Build & place OG fonts (nix)
        run: |
          nix build .#og-fonts -o og-fonts-result
          mkdir -p og/static/fonts
          cp og-fonts-result/*.ttf og/static/fonts/
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      - working-directory: og
        run: gleam deps download
      - working-directory: og
        run: npm ci
      - working-directory: og
        run: gleam test
      - working-directory: og
        run: gleam format --check src test

  deploy:
    needs: [changes, test-og]
    # test-og は og/ 変更時のみ走るので、skippedでもデプロイは続行させる。
    # ogテストが失敗してもブログ本体のデプロイは止めない
    # (OG Workerのデプロイのみテスト合格をゲートにする)
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.changes.result == 'success'
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # RSS dates come from git commit times, so the full history
          # (not a shallow clone) is required for correct pubDates.
          fetch-depth: 0
      - uses: nixbuild/nix-quick-install-action@v35
      # - uses: cachix/install-nix-action@v31
      #   with:
      #     github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@main

      # - name: Restore and save Nix store
      #   uses: nix-community/cache-nix-action@v7
      #   with:
      #     primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
      #     restore-prefixes-first-match: nix-${{ runner.os }}-
      #     gc-max-store-size-linux: 1G
      #     purge: true
      #     purge-prefixes: nix-${{ runner.os }}-
      #     purge-created: 0
      #     purge-last-accessed: P1DT12H
      #     purge-primary-key: never

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-

      - name: Cache transformed images
        uses: actions/cache@v6
        with:
          path: |
            _cache
          key: images-${{ hashFiles('src/img/**') }}-v1
          restore-keys: |
            images-

      - name: Build & Deploy blog
        env:
          RELEASE: 1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          nix develop .#ci --command deno task build
          nix develop .#ci --command wrangler pages deploy ./_site --project-name=blog --commit-dirty=true

      # OG Workerはビルド入力 (og/・記事コーパス・nix定義) に変更がある場合のみ
      # デプロイ (手動実行時は常にデプロイ)
      # deploy-og は gleam/npm を使うため、それらを含まない .#ci ではなく
      # デフォルトのdevShellを使う (devShellのshellHookが最新コーパスで
      # サブセットしたフォントを og/static/fonts/ に配置する)
      - name: Deploy OG worker
        if: >-
          (github.event_name == 'workflow_dispatch' || needs.changes.outputs.og == 'true') &&
          needs.test-og.result == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: nix develop --command deno task deploy-og
