on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  # PRではビルド・テストに関係する変更を検知した時点で走らせる。
  # 以前は og/ と src/blog/ のみがtriggerで、ssg/ や host.ts (ビルドロジック)
  # を変えたPRではCIが起動せず、回帰が検出されなかった。
  # deployジョブはPRでは実行されないため、デプロイへの影響はない。
  pull_request:
    paths:
      - "og/**"
      - "src/blog/**"
      - "src/**"
      - "ssg/**"
      - "host.ts"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "flake.nix"
      - "flake.lock"

concurrency:
  # PRでは同一PR内の古い実行をキャンセルする (head_refがグループ名になる)。
  # それ以外 (mainへのpush・workflow_dispatch) はrunごとにユニークなグループ
  # (run_id) になるため一切キャンセルされない。
  # mainのrunをキャンセルすると、og/やsrc/blog/ (OGフォントのコーパス) の
  # 変更を含むrunが中断されたとき、次のrunのpaths-filterは直前コミットとの
  # 差分しか見ないためOG Workerの再デプロイがスキップされ、記事タイトルの
  # グリフが欠けたOG画像が生成されてしまうため。
  # (注意: queue: maxとcancel-in-progress: trueはリテラル・式ともに併用不可
  # なので、デプロイの直列化はdeployジョブ側のqueue: maxで行う)
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      og: ${{ steps.og.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 記事コーパスの比較に「変更前のコミット」が要るので浅いcloneにしない
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            og:
              # Worker本体
              - "og/**"
              # ogFonts derivationとWorkerのビルド定義
              - "flake.nix"
              - "flake.lock"
      # 記事 (src/blog/**) は ogFonts のコーパス元だが、カードに載るのは
      # #+TITLE: / #+DESCRIPTION: だけで、本文だけの修正ではフォントは
      # 1バイトも変わらない。ファイル単位のパス判定は中身を見ないため、
      # 本文修正だけのpushでもOG Workerのテスト・デプロイが走っていた。
      # そこでコーパスに実際に寄与する文字 (title/description 由来の集合) を
      # 変更前後で比較し、差があるときだけ og 扱いにする。
      - name: Check OG font corpus changes
        id: og
        env:
          BASE_REV: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          set -euo pipefail

          # flake.nix の ogFonts と同じ抽出規則。ここが乖離すると
          # 「フォントが変わったのにジョブが飛ぶ」または逆の誤判定になる。
          extract() {
            if [ "$1" = "" ] || ! git cat-file -e "$1^{commit}" 2>/dev/null; then
              return 1
            fi
            git ls-tree -r --name-only "$1" -- src/blog |
              grep -E '\.org$' |
              while IFS= read -r f; do
                git show "$1:$f" | awk '
                  index($0, "#+TITLE:") == 1 || index($0, "#+DESCRIPTION:") == 1 {
                    sub(/^[^:]*:[ \t]*/, "");
                    print
                  }
                '
              done | LC_ALL=C sort
          }

          # 1行 = 1タイトル or 1説明文なので、行の差分がそのままコーパスの差分になる
          if extract "$BASE_REV" > /tmp/before.txt 2>/dev/null; then
            extract HEAD > /tmp/after.txt
            if diff -q /tmp/before.txt /tmp/after.txt > /dev/null; then
              corpus_changed=false
            else
              corpus_changed=true
            fi
          else
            # 比較対象が取れない (初回push・force push・手動実行など) は
            # 取りこぼすより安全側に倒して実行する
            corpus_changed=true
          fi

          echo "corpus_changed=$corpus_changed"
          if [ "$corpus_changed" = "true" ] || [ "${{ steps.filter.outputs.og }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  test-og:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.og == 'true'
    runs-on: ubuntu-latest
    name: Test OG worker
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # og_worker/router.gleam のASSETS bindingとgleam testの
      # test_support.load_file_bytes が参照する og/static/fonts/*.ttf は
      # gitにコミットせず、flake.nixの packages.og-fonts (pyftsubsetで
      # ブログ記事コーパスからサブセット生成) をここでビルドして配置する
      - name: Build & place OG fonts (nix)
        run: |
          nix build .#og-fonts -o og-fonts-result
          mkdir -p og/static/fonts
          cp og-fonts-result/*.ttf og/static/fonts/
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "v1.19.2"
          rebar3-version: "3"
      - working-directory: og
        run: gleam deps download
      - working-directory: og
        run: npm ci
      - working-directory: og
        run: gleam test
      - working-directory: og
        run: gleam format --check src test
      # gleam testはNode上で動くため、setup_env.mjs (workerdのwasm動的コンパイル
      # 禁止を回避する静的importの差し替え) を一切通らない。satoriの自動更新で
      # wasmの出し方が変わると、ここを通さない限りビルドは緑のまま本番だけ
      # 500を返す (実際に satori 0.47 で一度起きた)。wrangler dev --local で
      # 実際にWorkerを起動し、実際にレンダリングさせて検出する
      - name: Smoke test OG image rendering (wrangler dev)
        working-directory: og
        run: |
          nix develop ..#ci --command wrangler dev --port 8799 --local &
          WRANGLER_PID=$!

          ready=""
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
              'http://127.0.0.1:8799/og.png?l=post&t=smoke+test&d=ci' || true)
            if [ "$code" = "200" ]; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ -z "$ready" ]; then
            echo "::error::wrangler dev did not become ready"
            kill "$WRANGLER_PID" 2>/dev/null || true
            exit 1
          fi

          for q in \
            'l=post&t=smoke+test&d=ascii+only' \
            'l=post&t=%E3%82%B9%E3%83%A2%E3%83%BC%E3%82%AF%E3%83%86%E3%82%B9%E3%83%88&d=%E6%97%A5%E6%9C%AC%E8%AA%9E%E3%82%B0%E3%83%AA%E3%83%95' \
            'l=main&t=%E3%83%A1%E3%82%A4%E3%83%B3%E3%83%AC%E3%82%A4%E3%82%A2%E3%82%A6%E3%83%88'; do
            out=$(mktemp)
            code=$(curl -s -o "$out" -w '%{http_code}' --max-time 30 \
              "http://127.0.0.1:8799/og.png?$q")
            if [ "$code" != "200" ]; then
              echo "::error::og.png returned $code for query '$q'"
              kill "$WRANGLER_PID" 2>/dev/null || true
              exit 1
            fi
            if ! file "$out" | grep -q 'PNG image data, 1200 x 600'; then
              echo "::error::og.png response for '$q' is not a 1200x600 PNG: $(file "$out")"
              kill "$WRANGLER_PID" 2>/dev/null || true
              exit 1
            fi
          done

          kill "$WRANGLER_PID" 2>/dev/null || true

  deploy:
    needs: [changes, test-og]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.changes.result == 'success'
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read
      id-token: write
    # デプロイのみ直列化する。queue: maxで最大100件待機し1件ずつ完走させる
    # (cancel-in-progressと併用不可なのでキャンセルではなく待機で競合を回避。
    # キャンセルするとOGフォントのコーパス変更を含むrunのデプロイが飛ぶため)
    concurrency:
      group: ${{ github.workflow }}-deploy-${{ github.ref }}
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          # RSS dates come from git commit times, so the full history
          # (not a shallow clone) is required for correct pubDates.
          fetch-depth: 0
      - uses: nixbuild/nix-quick-install-action@v35
      # - uses: cachix/install-nix-action@v31
      #   with:
      #     github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@main

      # - name: Restore and save Nix store
      #   uses: nix-community/cache-nix-action@v7
      #   with:
      #     primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
      #     restore-prefixes-first-match: nix-${{ runner.os }}-
      #     gc-max-store-size-linux: 1G
      #     purge: true
      #     purge-prefixes: nix-${{ runner.os }}-
      #     purge-created: 0
      #     purge-last-accessed: P1DT12H
      #     purge-primary-key: never

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-

      - name: Install dependencies
        run: |
          nix develop .#ci --command vp install --frozen-lockfile

      # テストスイート全体を走らせる。ここを互換性テスト2本に限定すると、
      # 脚注の水平線化 (ssg/org.ts) や下書きの非公開化 (host.ts) の
      # 回帰がCIで検出されなくなるため。互換性テストは dist/ を参照する
      # ので、先にDISABLE_LINKCARD=1 でビルドしておく必要がある。
      - name: Run test suite
        run: |
          nix develop .#ci --command bash -c '
            DISABLE_LINKCARD=1 vp build &&
            BUILD_OUTPUT_DIR=dist vp run test
          '

      - name: Build & Deploy blog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          nix develop .#ci --command vp run build
          nix develop .#ci --command wrangler pages deploy ./dist --project-name=blog --commit-dirty=true

      # OG Workerはビルド入力 (og/・記事コーパス・nix定義) に変更がある場合のみ
      # デプロイ (手動実行時は常にデプロイ)
      # `vp run deploy-og` は gleam/npm を使うため、それらを含まない .#ci ではなく
      # デフォルトのdevShellを使う (devShellのshellHookが最新コーパスで
      # サブセットしたフォントを og/static/fonts/ に配置する。vpはこのシェルの
      # vite-plus パッケージから提供される)
      - name: Deploy OG worker
        if: >-
          (github.event_name == 'workflow_dispatch' || needs.changes.outputs.og == 'true') &&
          needs.test-og.result == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: nix develop --command vp run deploy-og
