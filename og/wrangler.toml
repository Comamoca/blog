name = "blog-og"
main = "build/dev/javascript/og_worker/index.js"
compatibility_date = "2024-09-25"
# koishiのffi.mjsがread_test_font_file (テスト専用ヘルパー) でnode:fsを
# importするため必要 (harfbuzzjsの依存ではない。satori 0.47でharfbuzzjs
# パッケージへの依存自体は消えている)
compatibility_flags = ["nodejs_compat"]

# 本番: og.comamoca.dev カスタムドメイン (初回デプロイ時にDNSレコード自動作成)
routes = [{ pattern = "og.comamoca.dev", custom_domain = true }]

# キャッシュはCloudflare側 (cache-controlヘッダ) で行うため、ワーカー内
# Cache APIはデフォルト無効 (x-cache: BYPASS)。有効化する場合は以下を有効にする:
# [vars]
# OG_CACHE_API = "1"

# koishiのSVG→PNG変換が使うresvg-jsはネイティブ(napi)モジュールのため
# workerdで読み込めない。同じresvgのwasmビルド(resvg-wasm)を公開する
# shadow packageへ差し替える (初期化は src/index.js が行う)
# (harfbuzzjsのaliasはsatori 0.47でharfbuzzjsパッケージへの依存自体が
# 消えたため不要になった。wasmはsetup_env.mjsが静的importで直接差し替える)
[alias]
"@resvg/resvg-js" = "./src/og_worker/interop/vendor/resvg-js"

[build]
command = "gleam build --no-print-progress"

[assets]
directory = "./static"
binding = "ASSETS"

[cache]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
